name: iOS checks
# Tests and simulator screenshots only; installs come from TestFlight (testflight.yml).
# Manual only (Actions → iOS checks → Run workflow, pick the branch). On the self-hosted M4 (default) a run costs no
# Actions minutes; on xcode-27 (GitHub's Mac) it costs ~130 (macOS counts 10x). TestFlight (testflight.yml) is the normal install route now.
on:
  workflow_dispatch:
    inputs:
      measure:
        description: "Also measure every iPhone and iPad simulator, and save ios-resolution.com's table (~30 min)"
        type: boolean
        default: false
      devices:
        description: "Simulators to screenshot, comma-separated (e.g. iPhone SE (3rd generation),iPhone 16,iPad mini (A17 Pro)), or none"
        default: "iPhone 16 Pro Max,iPad Pro 13-inch (M4)"
      runner:
        description: "Mac: m4 = Jonah's MacBook Pro M4 Pro (self-hosted, Xcode 27, no Actions minutes); xcode-27 = GitHub's hosted Apple Silicon Xcode 27 (backup while the M4 is off). No Intel."
        type: choice
        options: [m4, xcode-27]
        default: m4
permissions:
  contents: write
concurrency: { group: "ios-${{ github.ref }}", cancel-in-progress: true }
# monorepo: the iOS suite lives in apps/ios-suite/ (the ci-logs step runs from the repo root)
defaults:
  run:
    working-directory: apps/ios-suite
jobs:
  build:
    # m4 = the self-hosted MacBook Pro M4 Pro (labels self-hosted, macOS, ARM64, cratebox-m4; setup in
    # apps/ios-suite/docs/self-hosted-runner.md); xcode-27 = GitHub's hosted Apple Silicon. Jonah (2026-11-12): no Intel
    # fallback; a stalled run is cancelled and retried on m4 or xcode-27
    runs-on: ${{ (inputs.runner || 'm4') == 'm4' && fromJSON('["self-hosted","macOS","ARM64","cratebox-m4"]') || inputs.runner }}
    steps:
      - uses: actions/checkout@v4
      - name: Xcode
        run: |
          brew install coreutils xcodegen >/dev/null 2>&1 || true
          for t in gtimeout xcodegen; do command -v $t >/dev/null || { echo "MISSING $t (on the M4: brew install coreutils xcodegen from Jonah's admin account)"; exit 1; }; done
          # DEVELOPER_DIR instead of `sudo xcode-select`: the self-hosted M4 runs as a standard user without sudo.
          # Newest installed Xcode 27 (Xcode_27.x.app on GitHub's Macs, Xcode.app / Xcode-beta.app on the M4)
          X=$(for a in /Applications/Xcode*.app; do v=$(defaults read "$a/Contents/Info" CFBundleShortVersionString 2>/dev/null) && echo "$v $a"; done | grep '^27\.' | sort -V | tail -1 | cut -d' ' -f2-)
          [ -n "$X" ] || { echo "NO XCODE 27 in /Applications: Xcode 27 on Apple Silicon only" | tee ci.log; exit 1; }
          [ "$(uname -m)" = arm64 ] || { echo "NOT APPLE SILICON ($(uname -m)): no Intel runners" | tee ci.log; exit 1; }
          echo "DEVELOPER_DIR=$X/Contents/Developer" >> "$GITHUB_ENV"
          export DEVELOPER_DIR="$X/Contents/Developer"
          echo "RUNNER ${RUNNER_NAME:-?} ($RUNNER_ENVIRONMENT) $X" | tee ci.log
          xcodebuild -version | tee -a ci.log
      # real tracks only (Jonah, 2026-11-12: no synthetic test tracks): a set of his tough tracks with rekordbox's
      # analysis, from a PRIVATE repo (this one is public: never commit music here). Without the TEST_TRACKS_TOKEN
      # secret (read-only, that repo only) the real-track tests skip and say so; a skip is not a pass
      - name: Real test tracks (private zonahbear/cratebox-test-tracks)
        env: { TOKEN: "${{ secrets.TEST_TRACKS_TOKEN }}" }
        run: |
          if [ -z "$TOKEN" ]; then echo "REAL TRACKS: not fetched (no TEST_TRACKS_TOKEN secret): real-track tests SKIP" | tee -a ci.log; exit 0; fi
          if git clone -q --depth 1 "https://x-access-token:${TOKEN}@github.com/zonahbear/cratebox-test-tracks.git" "$RUNNER_TEMP/real" 2>/dev/null; then
            echo "REAL TRACKS: $(ls "$RUNNER_TEMP/real/tracks" 2>/dev/null | wc -l | tr -d ' ') files, manifest $(test -f "$RUNNER_TEMP/real/manifest.json" && echo yes || echo MISSING)" | tee -a ci.log
          else
            echo "REAL TRACKS: clone FAILED (repo missing or token without access): real-track tests SKIP" | tee -a ci.log
          fi
      # the test and build steps carry on past a failure (so the screenshots and the log still happen) but the last
      # step fails the run if either of them failed: a green run means the tests passed and the app built
      - name: Core tests (swift test, optimised)
        id: tests
        continue-on-error: true
        timeout-minutes: 25      # a hung test (Xcode 27 once looped forever in Core.status) mustn't burn hours of Mac minutes
        run: |
          set -o pipefail
          cd ios/CrateboxKit && CRATEBOX_REAL="$RUNNER_TEMP/real" swift test -c release -Xswiftc -enable-testing 2>&1 | tee -a ../../ci.log
      - name: Launch in the simulators (screenshots)
        id: app
        continue-on-error: true
        timeout-minutes: 60      # three devices took 45+ minutes (run 43308247504)
        env: { DEVICES: "${{ inputs.devices || 'iPhone 16 Pro Max,iPad Pro 13-inch (M4)' }}" }
        run: |
          cd ios
          brew install xcodegen >/dev/null 2>&1 || true
          xcodegen generate 2>&1 | tail -3 | tee -a ../ci.log
          xcodebuild -project Cratebox.xcodeproj -scheme Cratebox -configuration Release -sdk iphonesimulator -destination 'generic/platform=iOS Simulator' \
            -derivedDataPath "$RUNNER_TEMP/dds" CODE_SIGNING_ALLOWED=NO build 2>&1 | grep -E "error:|BUILD" | tee -a ../ci.log
          [ "${PIPESTATUS[0]}" = 0 ] || { echo "APP BUILD FAILED" | tee -a ../ci.log; exit 1; }
          APP=$(ls -d "$RUNNER_TEMP"/dds/Build/Products/Release-iphonesimulator/*.app | head -1)
          echo "APP=$APP" >> "$GITHUB_ENV"
          [ "$DEVICES" = none ] && exit 0      # measurement run only
          mkdir -p "$RUNNER_TEMP/shots"
          IFS=, read -ra DEVS <<< "$DEVICES"
          for dev in "${DEVS[@]}"; do
            dev=$(echo "$dev" | sed 's/^ *//; s/ *$//')
            UDID=$(xcrun simctl list devices available -j | python3 -c "import json,sys; d=json.load(sys.stdin)['devices']; print(next((x['udid'] for r in d.values() for x in r if x['name']=='$dev'), ''))")
            # not on this runner: make it from its device type on the newest iOS runtime (never stand in another
            # model: run 43308247504 shot an iPhone 17 Pro three times as "16 Pro Max" and "SE")
            if [ -z "$UDID" ]; then
              TYPE=$(xcrun simctl list devicetypes -j | python3 -c "import json,sys; print(next((t['identifier'] for t in json.load(sys.stdin)['devicetypes'] if t['name']=='$dev'), ''))")
              RT=$(xcrun simctl list runtimes available -j | python3 -c "import json,sys; r=[x for x in json.load(sys.stdin)['runtimes'] if x.get('platform')=='iOS']; print(r[-1]['identifier'] if r else '')")
              [ -n "$TYPE" ] && [ -n "$RT" ] && UDID=$(xcrun simctl create "$dev" "$TYPE" "$RT" 2>/dev/null || true)
            fi
            if [ -z "$UDID" ]; then echo "SIM MISSING $dev (no simulator for it on this runner's iOS runtime): skipped" | tee -a ../ci.log; continue; fi
            echo "SIM $dev $UDID" | tee -a ../ci.log
            xcrun simctl boot "$UDID" || true
            [ "${dev%% *}" = iPhone ] && xcrun simctl ui "$UDID" appearance dark || true
            gtimeout 240 xcrun simctl bootstatus "$UDID" -b > /dev/null 2>&1 || true
            xcrun simctl install "$UDID" "$APP"
            xcrun simctl launch "$UDID" com.zonahbear.cratebox.suite -demo | tee -a ../ci.log
            sleep 25
            xcrun simctl spawn "$UDID" launchctl list 2>/dev/null | grep -q cratebox && echo "SIM RUNNING $dev" | tee -a ../ci.log || echo "SIM NOT RUNNING $dev (crashed?)" | tee -a ../ci.log
            n=$(echo "$dev" | tr ' ()' '___')
            xcrun simctl io "$UDID" screenshot "$RUNNER_TEMP/shots/$n.png" || true
            # the compact layout: an SE at its Display Zoom size (568x320, which the simulator can't switch on),
            # left deck on PLAY and right on PADS; on other phones, the Settings switch forcing it
            if [ "${dev#iPhone SE}" != "$dev" ]; then
              # plus Settings (tabs) at that size: the Sound tab and AI mode's tab with AI mode on
              for v in "568x320:" "568x320:-four" "568x320:-pads" "568x320:-eject" "568x320:-settings -cb.settingsTab audio" "568x320:-settings -cb.settingsTab library" "568x320:-settings -cb.settingsTab ai -cb.ai YES"; do
                xcrun simctl terminate "$UDID" com.zonahbear.cratebox.suite || true
                xcrun simctl launch "$UDID" com.zonahbear.cratebox.suite -demo -screen "${v%%:*}" ${v#*:} > /dev/null || true
                sleep 15
                xcrun simctl io "$UDID" screenshot "$RUNNER_TEMP/shots/${n}_zoom$(echo "${v#*:}" | tr ' .' '__').png" || true
              done
            elif [ "${dev%% *}" = iPhone ]; then
              xcrun simctl terminate "$UDID" com.zonahbear.cratebox.suite || true
              xcrun simctl launch "$UDID" com.zonahbear.cratebox.suite -demo -pads -cb.compact YES > /dev/null || true
              sleep 15
              xcrun simctl io "$UDID" screenshot "$RUNNER_TEMP/shots/${n}_compact.png" || true
            fi
            # EJECT (a stand-in "DJ USB" drive): pressed with deck 1 playing, then with every deck stopped
            if [ "${dev%% *}" = iPhone ]; then
              for v in "eject:-eject" "eject_stopped:-eject -stopped"; do
                xcrun simctl terminate "$UDID" com.zonahbear.cratebox.suite || true
                xcrun simctl launch "$UDID" com.zonahbear.cratebox.suite -demo ${v#*:} > /dev/null || true
                sleep 18
                xcrun simctl io "$UDID" screenshot "$RUNNER_TEMP/shots/${n}_${v%%:*}.png" || true
              done
            fi
            xcrun simctl terminate "$UDID" com.zonahbear.cratebox.suite || true
            xcrun simctl launch "$UDID" com.zonahbear.cratebox.suite -demo -four > /dev/null || true
            sleep 20
            xcrun simctl io "$UDID" screenshot "$RUNNER_TEMP/shots/${n}_4decks.png" || true
            xcrun simctl terminate "$UDID" com.zonahbear.cratebox.suite || true
            xcrun simctl launch "$UDID" com.zonahbear.cratebox.suite -demo -browse > /dev/null || true
            sleep 20
            xcrun simctl io "$UDID" screenshot "$RUNNER_TEMP/shots/${n}_browse.png" || true
            # WAVE mode, 2 and 4 decks (deck 1 playing, so the FLX4 lanes glow)
            xcrun simctl terminate "$UDID" com.zonahbear.cratebox.suite || true
            xcrun simctl launch "$UDID" com.zonahbear.cratebox.suite -demo -wave > /dev/null || true
            sleep 20
            xcrun simctl io "$UDID" screenshot "$RUNNER_TEMP/shots/${n}_wave.png" || true
            xcrun simctl terminate "$UDID" com.zonahbear.cratebox.suite || true
            xcrun simctl launch "$UDID" com.zonahbear.cratebox.suite -demo -four -wave > /dev/null || true
            sleep 20
            xcrun simctl io "$UDID" screenshot "$RUNNER_TEMP/shots/${n}_wave4.png" || true
            # Xcode 27 redraw check: state changed from code 6 s after launch (4 decks, crossfader left, deck 1 bass cut, tempo down)
            xcrun simctl terminate "$UDID" com.zonahbear.cratebox.suite || true
            xcrun simctl launch "$UDID" com.zonahbear.cratebox.suite -demo -redraw > /dev/null || true
            sleep 20
            xcrun simctl io "$UDID" screenshot "$RUNNER_TEMP/shots/${n}_redraw.png" || true
            # AI DJ (AI mode on), with the demo decks loaded underneath
            xcrun simctl terminate "$UDID" com.zonahbear.cratebox.suite || true
            xcrun simctl launch "$UDID" com.zonahbear.cratebox.suite -aidj -demo -cb.ai YES > /dev/null || true
            sleep 15
            xcrun simctl io "$UDID" screenshot "$RUNNER_TEMP/shots/${n}_aidj.png" || true
            # the suite's other two modes: Deck Bridge, and Cratebox USB on a copy of the test stick (no audio: the scan flags it)
            xcrun simctl terminate "$UDID" com.zonahbear.cratebox.suite || true
            xcrun simctl launch "$UDID" com.zonahbear.cratebox.suite -bridge > /dev/null || true
            sleep 12
            xcrun simctl io "$UDID" screenshot "$RUNNER_TEMP/shots/${n}_bridge.png" || true
            xcrun simctl terminate "$UDID" com.zonahbear.cratebox.suite || true
            DATA=$(xcrun simctl get_app_container "$UDID" com.zonahbear.cratebox.suite data 2>/dev/null || true)
            if [ -n "$DATA" ]; then mkdir -p "$DATA/Documents/DemoUSB" && cp -R ../tests/fixtures/rekordbox_usb/PIONEER "$DATA/Documents/DemoUSB/"; fi
            xcrun simctl launch "$UDID" com.zonahbear.cratebox.suite -usb -demo > /dev/null || true
            sleep 25
            xcrun simctl io "$UDID" screenshot "$RUNNER_TEMP/shots/${n}_usb.png" || true
            gtimeout 60 xcrun simctl spawn "$UDID" log show --last 1m --predicate 'process == "Cratebox"' --style compact 2>/dev/null | grep -iE "fault|crash|fatal" | head -10 | tee -a ../ci.log || true
            gtimeout 60 xcrun simctl spawn "$UDID" log show --last 1m --predicate 'process == "Cratebox"' --style compact 2>/dev/null | grep -iE "fault|error|crash|fatal|DEMO MIDI" | head -20 | tee -a ../ci.log || true
            xcrun simctl shutdown "$UDID" || true
          done
          ls "$RUNNER_TEMP/shots" | tee -a ../ci.log
      - name: Measure every iPhone and iPad simulator (screen size, scale, landscape safe area)
        if: inputs.measure
        continue-on-error: true
        timeout-minutes: 60
        run: |
          mkdir -p "$RUNNER_TEMP/shots"; OUT="$RUNNER_TEMP/shots/metrics.txt"; : > "$OUT"
          # the newest iOS runtime's devices only
          xcrun simctl list devices available -j | python3 -c "
          import json,sys
          d=json.load(sys.stdin)['devices']
          ios=sorted([k for k in d if 'iOS' in k], key=lambda k: [int(x) for x in k.split('iOS-')[1].split('-')])
          for x in d[ios[-1]]:
              if x['name'].startswith(('iPhone','iPad')): print(x['udid']+'|'+x['name'])
          " > "$RUNNER_TEMP/sims.txt"
          echo "SIM runtime has $(wc -l < "$RUNNER_TEMP/sims.txt") phones and iPads" | tee -a ci.log
          while IFS='|' read -r UDID NAME <&3; do
            xcrun simctl boot "$UDID" || true
            gtimeout 240 xcrun simctl bootstatus "$UDID" -b > /dev/null 2>&1 || true
            xcrun simctl install "$UDID" "$APP" || true
            xcrun simctl launch "$UDID" com.zonahbear.cratebox.suite -metrics YES > /dev/null || true
            DATA=$(xcrun simctl get_app_container "$UDID" com.zonahbear.cratebox.suite data 2>/dev/null || true)
            for k in $(seq 1 20); do [ -s "$DATA/Documents/metrics.txt" ] && break; sleep 1; done
            { echo "== $NAME"; cat "$DATA/Documents/metrics.txt" 2>/dev/null || echo "no metrics (app didn't start?)"; } | tee -a "$OUT"
            xcrun simctl shutdown "$UDID" || true
          done 3< "$RUNNER_TEMP/sims.txt"
          sed 's/^/METRIC /' "$OUT" >> ci.log
      - name: Reference table (ios-resolution.com, unreachable from the dev sandbox)
        if: inputs.measure
        continue-on-error: true
        run: |
          curl -sSL -m 60 -A "Mozilla/5.0" -o "$RUNNER_TEMP/shots/ios-resolution.html" https://www.ios-resolution.com/ && echo "REF ios-resolution.com $(wc -c < "$RUNNER_TEMP/shots/ios-resolution.html") bytes" | tee -a ci.log
      - name: Error summary to the ci-logs branch (ci-logs-preview for preview branches)
        if: always()
        working-directory: .
        env: { LOGS: "${{ github.ref == 'refs/heads/main' && 'ci-logs' || 'ci-logs-preview' }}" }
        run: |
          { echo "run ${{ github.run_id }} sha ${{ github.sha }} at $(date -u)"; cd apps/ios-suite; grep -E "error:|warning: unre|FAIL|failed|Executed|BUILD|passed|DSP |ANALYSIS |TRACKS |ENGINE |SYNC |REDRAW |REAL |PUBLISHED|CrateboxSuite.ipa|SIM |DEMO MIDI|METRIC |REF |\*\* " ci.log | head -600; echo "---- tail"; tail -80 ci.log; cd ../..; } > summary.txt || true
          git config user.name ci; git config user.email ci@users.noreply.github.com
          git fetch origin "$LOGS" || true
          { git branch -D ci-tmp >/dev/null 2>&1 || true; } && git checkout --orphan ci-tmp && git rm -rfq --cached . >/dev/null
          cp summary.txt ios-latest.txt
          mkdir -p shots && cp "$RUNNER_TEMP"/shots/*.png "$RUNNER_TEMP"/shots/*.txt "$RUNNER_TEMP"/shots/*.html shots/ 2>/dev/null || true
          git add -f ios-latest.txt shots && git commit -qm "ios ci ${{ github.run_id }}" && git push -qf origin "HEAD:$LOGS"
      - name: Fail the run if the tests or the app build failed
        if: always()
        run: |
          echo "tests: ${{ steps.tests.outcome }} · app: ${{ steps.app.outcome }}"
          [ "${{ steps.tests.outcome }}" = success ] && [ "${{ steps.app.outcome }}" = success ]
