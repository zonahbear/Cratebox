# Problem reports sent from Cratebox ("Report a problem" → Send on GitHub) arrive as issues with a hidden
# marker. This copies each one into reports.txt in the repo, so they're all in one plain text file.
name: Collect problem reports
on:
  issues:
    types: [opened]
permissions:
  contents: write
concurrency:
  group: reports-txt
  cancel-in-progress: false
jobs:
  append:
    if: contains(github.event.issue.body, 'cratebox-report')
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Append the report to reports.txt
        env:
          NUM: ${{ github.event.issue.number }}
          TITLE: ${{ github.event.issue.title }}
          BODY: ${{ github.event.issue.body }}
          URL: ${{ github.event.issue.html_url }}
          WHO: ${{ github.event.issue.user.login }}
          WHEN: ${{ github.event.issue.created_at }}
        run: |
          {
            echo "=================================================================="
            echo "#$NUM  $WHEN  from $WHO"
            echo "$TITLE"
            echo "$URL"
            echo "------------------------------------------------------------------"
            printf '%s\n' "$BODY" | tr -d '\r' | grep -v 'cratebox-report'
            echo
          } >> reports.txt
          git config user.name "cratebox-reports"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add reports.txt
          git commit -m "Problem report #$NUM"
          for i in 1 2 3; do git push && break; git pull --rebase; done
