# Cloudflare Worker for the Cratebox website (site/). Setup steps: site/README.md.
# Static files come from site/dist (built by site/build.sh); /api/* runs site/src/worker.js.
name = "cratebox"
main = "site/src/worker.js"
compatibility_date = "2025-09-01"

[build]
command = "bash site/build.sh"

[assets]
directory = "site/dist"
binding = "ASSETS"
# Serve .html paths as-is (no redirects): the player's service worker and manifest point at cratebox.html.
html_handling = "none"

# Signups, rate limits and cached App Store Connect ids (namespace "cratebox"; the id is not a secret).
[[kv_namespaces]]
binding = "DB"
id = "79b878980e2c49279dfee7bb42bb9e47"

# Finishes invites for people who accepted Apple's team email.
[triggers]
crons = ["*/15 * * * *"]

[vars]
SITE_URL = "https://cratebox.example.workers.dev"   # set to the real address after the first deploy
ASC_BUNDLE_ID = "com.zonahbear.cratebox.suite"
ASC_GROUP_NAME = ""          # internal TestFlight group to use; empty = the app's first internal group
ASC_ROLE = "MARKETING"       # team role for testers; Apple allows MARKETING or DEVELOPER (or higher) for internal testing
AUTO_APPROVE = "false"       # "true" invites without asking you first
MAIL_FROM = "Cratebox <onboarding@resend.dev>"
# Secrets, never in this file: ASC_KEY_ID ASC_ISSUER_ID ASC_KEY_P8 RESEND_API_KEY ADMIN_EMAIL LINK_SECRET
